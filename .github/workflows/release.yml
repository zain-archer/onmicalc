name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

      - name: Package the static build
        run: |
          cd dist
          zip -qr ../omnica-web.zip .
          tar czf ../omnica-web.tar.gz .
          cd ..
          sha256sum omnica-web.zip omnica-web.tar.gz > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            omnica-web.zip
            omnica-web.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          body_path: CHANGELOG.md
